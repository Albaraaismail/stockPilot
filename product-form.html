<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add / Edit product - StockPilot</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="center">
<form class="card" action="product-detail.html">
<h1>Add / Edit product</h1>
<label for="name">Product name</label>
<input type="text" id="product-name" name="name" placeholder="Enter product name" required>
<label for="price">Price ($)</label>
<input type="number" id="price" name="price" min="0" step="0.01" required>
<label for="stock">Stock</label>
<input type="number" id="product-qty" name="stock" min="0" step="1" required>
<label for="category">Category</label>
<select id="category" name="category" required>
<option value="">Choose a category</option>
<option>Laptops</option>
<option>Desktops</option>
<option>Accessories</option>
<option>Electronics</option>
<option>Home</option>
<option>Fashion</option>
</select>
<label for="description">Description</label>
<textarea id="description" name="description" rows="4" placeholder="Short product description"></textarea>
<label for="image">Image</label>
<input type="file" id="image" name="image" accept="image/*">
<label class="check"><input type="checkbox" name="featured"> Featured product</label>
<div class="actions-row">
<button class="btn btn-primary" onclick="addProduct()">Add Product</button>
<button class="btn secondary" type="button">Cancel</button>
</div>
</form>
</main>
<script src="app.js"></script> 
</body>
</html>
