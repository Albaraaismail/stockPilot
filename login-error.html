<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - StockPilot</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<main class="center">
<form class="card" action="products.html">
<h1 class="brand">StockPilot</h1>
<p class="error" role="alert">Invalid email or password. Please try again.</p>
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required class="invalid" aria-invalid="true">
<label for="password">Password</label>
<input type="password" id="password" name="password" required class="invalid" aria-invalid="true">
<button class="btn" type="submit">Login</button>
</form>
</main>
</body>
</html>
